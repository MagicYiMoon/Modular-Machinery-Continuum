# --- Optional integration versions ---------------------------------------------------------
# Pinned here rather than inline in build.gradle so every coordinate is in one place. All of these
# are compileOnly soft dependencies: the mod must load with none of them installed.
jei_version=15.62.0.216
# The One Probe, via CurseMaven. Split into project id and file id because CurseMaven addresses
# files by their CurseForge numeric ids rather than by version string.
top_project=245211
top_file=8856919
crafttweaker_version=14.0.60
# Applied Energistics 2, served from modmaven.dev (blamejared's mirror lacks it).
ae2_version=15.4.11
# Mekanism, also served from modmaven.dev. Version is fully qualified with the MC version.
mekanism_version=1.20.1-10.4.16.80
fluxnetworks_project=248020
fluxnetworks_file=5234697
# GuideME -- a MANDATORY dependency of AE2 15.4.11, which declares `guideme [20.1.7,20.2.0)`. Not optional and NOT
# implied by "AE2 15.x" in the objective: found by running with the integrations present (PLAN section 405.2), which
# is the only configuration that can see it. Served from Modrinth, whose maven is added in build.gradle.
guideme_version=20.1.7

# GeckoLib 4 for Forge 1.20.1. The released jar already contains its mclib runtime
# through GeckoLib's own Jar-in-Jar metadata; MMCE embeds the GeckoLib jar below.
geckolib_version=4.8.4

# Optional AE2 chemical-key bridge for ME gas buses (Applied Mekanistics, MC 1.20.1).
appmek_version=1.4.3

# Optional Botania API and its required runtime companions, pinned Modrinth versions.
botania_version=npY4sRWF
patchouli_version=94dtOLgZ
curios_version=IPQlZkz1
bloodmagic_version=1YxwR16I

# Nature's Aura 39.4, official Forge 1.20.1 release.
naturesaura_version=8UiPp0gC

# Fixed community source build (3cb5243); external optional jars in libs/optional.
astral_community_version=1.20.1-1.0.0.0
rainbow_community_version=1.7.3
