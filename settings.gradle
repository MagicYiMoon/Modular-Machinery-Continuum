pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        // MixinGradle (org.spongepowered:mixingradle) is published here.
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    // 自动下载 java.toolchain 所需 JDK（MDK 原样）。
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = "modularmachinery"
