modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MagicYiMoon/Modular-Machinery-Continuum/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/MagicYiMoon/Modular-Machinery-Continuum"
authors="${mod_authors}"
credits="HellFirePvP (original code & design), wiiv (models & textures), KasumiNova, youyihj, ikexing (Community Edition). Ported to Forge 1.20.1 by the Modular Machinery: Continuum (MMC) project."
description='''${mod_description}'''
logoFile="logo.png"

[[dependencies.${mod_id}]]
modId="forge"
versionRange="${forge_version_range}"
mandatory=true
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true
ordering="NONE"
side="BOTH"

# GeckoLib is embedded in the released MMCE jar by ForgeGradle's Jar-in-Jar
# task. Declaring it here makes the bundled library a normal Forge dependency
# and gives a clear error if an external installation shadows it with an older
# incompatible version.
[[dependencies.${mod_id}]]
modId="geckolib"
versionRange="[${geckolib_version},)"
mandatory=true
ordering="AFTER"
side="BOTH"

